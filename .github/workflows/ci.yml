name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wireops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wireops_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: client

      - name: Set up test database schema
        run: npx ts-node --transpile-only scripts/ci-db-setup.ts

      - name: Run checks
        run: npm run check

      - name: Test backup verification
        run: python3 -m unittest discover -s tests -p test_sql_restore.py

      - name: Build server
        run: npm run build:server

      - name: Build dashboard
        run: npm run build
        working-directory: client
