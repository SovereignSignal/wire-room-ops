name: Test Backup Restore

on:
  workflow_dispatch:

jobs:
  test-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Download latest backup from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          LATEST=$(aws s3 ls "s3://wire-room-backups/" --endpoint-url "$R2_ENDPOINT" | sort | tail -1 | awk '{print $4}')
          echo "Downloading: ${LATEST}"
          aws s3 cp "s3://wire-room-backups/${LATEST}" backup.sql.gz --endpoint-url "$R2_ENDPOINT"
          gunzip backup.sql.gz
          echo "Decompressed: $(du -h backup.sql | cut -f1)"

      - name: Restore to fresh Postgres
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: testpass
          PGDATABASE: restore_test
        run: |
          /usr/lib/postgresql/17/bin/psql -c "SELECT version();"
          echo "--- Restoring backup ---"
          /usr/lib/postgresql/17/bin/psql < backup.sql 2>&1
          echo "--- Restore complete ---"

      - name: Verify restored data
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: testpass
          PGDATABASE: restore_test
        run: |
          echo "=== Table Count ==="
          /usr/lib/postgresql/17/bin/psql -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';"

          echo "=== Tables and Row Counts ==="
          /usr/lib/postgresql/17/bin/psql -c "
            SELECT schemaname, tablename
            FROM pg_tables
            WHERE schemaname = 'public'
            ORDER BY tablename;
          "

          echo "=== Row counts per table ==="
          /usr/lib/postgresql/17/bin/psql -t -c "
            SELECT tablename, n_live_tup
            FROM pg_stat_user_tables
            ORDER BY tablename;
          "

          echo "=== Key table spot checks ==="
          /usr/lib/postgresql/17/bin/psql -c "SELECT count(*) AS scan_entries FROM scan_entries;"
          /usr/lib/postgresql/17/bin/psql -c "SELECT count(*) AS summaries FROM summaries;"
          /usr/lib/postgresql/17/bin/psql -c "SELECT count(*) AS feeds FROM feeds;"
          /usr/lib/postgresql/17/bin/psql -c "SELECT count(*) AS scan_prompts FROM scan_prompts;"

          echo "=== Index Count ==="
          /usr/lib/postgresql/17/bin/psql -t -c "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public';"

          echo "=== RESTORE TEST PASSED ==="
