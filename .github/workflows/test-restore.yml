name: Test Backup Restore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Download latest backup from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          LATEST=$(aws s3 ls "s3://wire-room-backups/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | grep -E '^backup-[0-9]{8}-[0-9]{6}\.sql\.gz$' | sort | tail -1)
          test -n "$LATEST"
          echo "Downloading: ${LATEST}"
          aws s3 cp "s3://wire-room-backups/${LATEST}" backup.sql.gz --endpoint-url "$R2_ENDPOINT"
          gunzip backup.sql.gz
          echo "Decompressed: $(du -h backup.sql | cut -f1)"

      - name: Restore to fresh Postgres
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: testpass
          PGDATABASE: restore_test
        run: |
          /usr/lib/postgresql/17/bin/psql -c "SELECT version();"
          echo "--- Restoring backup ---"
          /usr/lib/postgresql/17/bin/psql -X --set=ON_ERROR_STOP=1 --single-transaction --file=backup.sql > restore.log 2>&1 || { echo "::error::Restore failed; no success receipt will be emitted"; exit 1; }
          echo "--- Restore complete ---"

      - name: Verify restored data
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: testpass
          PGDATABASE: restore_test
        run: |
          python3 -m unittest discover -s tests -p 'test_sql_restore.py'
          python3 scripts/verify-sql-restore.py backup.sql | tee restore-verification.json
          cat restore-verification.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: restore-verification
          path: restore-verification.json
          retention-days: 30
