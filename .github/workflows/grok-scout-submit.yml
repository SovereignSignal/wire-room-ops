name: Grok Telegram Batch

# workflow_dispatch only — do not run on push (Railway deploys from main).
# Posts the same markdown Sov pastes into @GrantWireSummarizer_bot into
# POST /api/scan/telegram-batch (processBatchMessage, scan_source=telegram).
on:
  workflow_dispatch:
    inputs:
      text:
        description: "Telegram-parseable batch markdown"
        required: true
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST to WRO /api/scan/telegram-batch
        env:
          WRO_INTERNAL_API_KEY: ${{ secrets.WRO_INTERNAL_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          TEXT: ${{ inputs.text }}
          WRO_URL: https://wire-room-ops-production.up.railway.app/api/scan/telegram-batch
        run: |
          set -euo pipefail
          KEY="${WRO_INTERNAL_API_KEY:-${INTERNAL_API_KEY:-}}"
          if [ -z "$KEY" ]; then
            echo "Missing Actions secret WRO_INTERNAL_API_KEY (or INTERNAL_API_KEY)."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          text = os.environ["TEXT"]
          key = os.environ.get("WRO_INTERNAL_API_KEY") or os.environ.get("INTERNAL_API_KEY") or ""
          url = os.environ["WRO_URL"]
          body = json.dumps({"text": text}).encode()
          req = urllib.request.Request(
              url, data=body, method="POST",
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=90) as resp:
                  data = resp.read().decode()
                  print("HTTP", resp.status)
                  parsed = json.loads(data)
                  keys = ("success", "inserted", "duplicates", "errors", "retryableErrors", "error")
                  print({k: parsed.get(k) for k in keys if k in parsed})
                  for entry in (parsed.get("entries") or [])[:12]:
                      flag = "dup" if entry.get("isDuplicate") else ("id=" + str(entry.get("id")))
                      print("-", entry.get("name"), flag)
          except urllib.error.HTTPError as e:
              print("HTTP", e.code)
              print(e.read().decode()[:800])
              raise SystemExit(1)
          PY
